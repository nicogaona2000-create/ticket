<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Control de Despensa GT</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Librería de Escáner -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-gray-100 min-h-screen pb-10">

  <header class="bg-blue-600 text-white py-4 px-6 text-center shadow-md">
    <h1 class="text-2xl font-bold">🛒 Control de Despensa GT</h1>
    <p class="text-xs text-blue-100">Registro rápido de abasto</p>
  </header>

  <main class="max-w-md mx-auto mt-6 px-4 space-y-6">

    <!-- SECCIÓN 1: ESCÁNER DE CÓDIGO DE BARRAS -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
      <h2 class="font-bold text-gray-800 text-lg mb-3">1. Escanear Código de Barras</h2>
      
      <!-- Contenedor del Visor -->
      <div id="reader" class="overflow-hidden rounded-lg bg-black min-h-[220px]"></div>

      <div class="mt-3 flex gap-2">
        <button id="btn-scan-start" onclick="iniciarEscaner()" class="flex-1 bg-blue-600 text-white font-medium py-3 rounded-xl text-sm shadow hover:bg-blue-700 active:scale-95 transition">
          📷 Abrir Escáner HD
        </button>
        <button id="btn-scan-stop" onclick="detenerEscaner()" class="hidden flex-1 bg-gray-500 text-white font-medium py-3 rounded-xl text-sm hover:bg-gray-600 active:scale-95 transition">
          ❌ Detener Escáner
        </button>
      </div>

      <div class="mt-3">
        <label class="text-xs text-gray-500 font-semibold">Código Escaneado:</label>
        <input type="text" id="codigo" placeholder="Esperando escáner..." class="w-full mt-1 p-2 bg-gray-50 border rounded-lg text-sm text-gray-800 font-mono font-bold">
      </div>
    </div>

    <!-- SECCIÓN 2: EVIDENCIA EN FOTO -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
      <h2 class="font-bold text-gray-800 text-lg mb-3">2. Foto de Evidencia</h2>
      
      <label class="block w-full text-center bg-gray-50 border-2 border-dashed border-blue-400 p-4 rounded-xl cursor-pointer hover:bg-blue-50 transition">
        <span class="text-sm font-medium text-blue-600">📸 Tomar Foto del Producto / Ticket</span>
        <input type="file" id="foto-input" accept="image/*" capture="environment" class="hidden" onchange="previsualizarFoto(event)">
      </label>

      <!-- Previsualización -->
      <div id="preview-container" class="mt-3 hidden text-center">
        <img id="foto-preview" class="max-h-48 mx-auto rounded-lg shadow-sm border" src="" alt="Evidencia">
        <span class="text-xs text-green-600 font-medium block mt-1">✓ Foto capturada</span>
      </div>
    </div>

    <!-- SECCIÓN 3: DETALLES DEL PRODUCTO -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 space-y-4">
      <h2 class="font-bold text-gray-800 text-lg">3. Datos de Compra</h2>

      <div>
        <label class="text-xs font-semibold text-gray-600">Nombre del Producto *</label>
        <input type="text" id="producto" placeholder="Ej: Aceite Nutrioli 946ml" class="w-full mt-1 p-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-semibold text-gray-600">Cantidad *</label>
          <input type="number" id="cantidad" value="1" min="0.1" step="any" oninput="calcularTotal()" class="w-full mt-1 p-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-600">Precio Unitario ($) *</label>
          <input type="number" id="precio" placeholder="0.00" step="any" oninput="calcularTotal()" class="w-full mt-1 p-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
      </div>

      <!-- Total a Pagar -->
      <div class="bg-blue-50 p-4 rounded-xl flex justify-between items-center border border-blue-100">
        <span class="text-sm font-bold text-blue-900">Total a Pagar:</span>
        <span id="total-pagar" class="text-2xl font-black text-blue-600">$0.00</span>
      </div>

      <!-- Switch Selección -->
      <div class="flex items-center justify-between pt-2">
        <span class="text-sm font-medium text-gray-700">¿Agregar a la cuenta actual?</span>
        <label class="relative inline-flex items-center cursor-pointer">
          <input type="checkbox" id="seleccion" class="sr-only peer" checked>
          <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
        </label>
      </div>
    </div>

    <!-- BOTÓN DE ENVÍO -->
    <button onclick="guardarRegistro()" id="btn-guardar" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3.5 rounded-2xl shadow-lg transition text-base active:scale-95">
      💾 Guardar en Despensa GT
    </button>

  </main>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxRW35KrTUG0VfCYOeileuaS6SOqgC26mNqkeKfRJs1Rh3iLGgx9W8reTzHDq7gZE2tCw/exec";

    let html5QrCode = null;
    let fotoBase64 = "";
    let userGps = "";

    // 1. Obtener Geolocalización GPS
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => {
          userGps = `${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}`;
        },
        err => console.log("GPS no disponible:", err)
      );
    }

    // 2. Control del Escáner Configurado en HD y formatos específicos
    async function iniciarEscaner() {
      document.getElementById('btn-scan-start').classList.add('hidden');
      document.getElementById('btn-scan-stop').classList.remove('hidden');

      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }

      // Definir formatos de códigos de barras comerciales de despensa
      const formatsSupported = [
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.CODE_128
      ];

      // Configuración de Alta Definición y cuadro de enfoque rectangular
      const cameraConstraints = {
        facingMode: "environment",
        width: { min: 1280, ideal: 1920 },
        height: { min: 720, ideal: 1080 }
      };

      const qrConfig = {
        fps: 20,
        qrbox: { width: 280, height: 110 },
        formatsToSupport: formatsSupported
      };

      const onScanSuccess = (decodedText) => {
        document.getElementById('codigo').value = decodedText;
        detenerEscaner();
        try {
          const audio = new Audio('https://media.geeksforgeeks.org/wp-content/uploads/20190529122812/beep.mp3');
          audio.play();
        } catch(e){}
      };

      try {
        await html5QrCode.start(cameraConstraints, qrConfig, onScanSuccess, () => {});
      } catch (err) {
        // Fallback si la cámara no soporta restricciones HD exactas
        try {
          await html5QrCode.start({ facingMode: "environment" }, qrConfig, onScanSuccess, () => {});
        } catch (e) {
          alert("Error de cámara en iPhone: " + e);
          detenerEscaner();
        }
      }
    }

    function detenerEscaner() {
      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          document.getElementById('btn-scan-start').classList.remove('hidden');
          document.getElementById('btn-scan-stop').classList.add('hidden');
        }).catch(() => {
          document.getElementById('btn-scan-start').classList.remove('hidden');
          document.getElementById('btn-scan-stop').classList.add('hidden');
        });
      } else {
        document.getElementById('btn-scan-start').classList.remove('hidden');
        document.getElementById('btn-scan-stop').classList.add('hidden');
      }
    }

    // 3. Previsualizar foto de evidencia
    function previsualizarFoto(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          fotoBase64 = e.target.result;
          document.getElementById('foto-preview').src = fotoBase64;
          document.getElementById('preview-container').classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    }

    // 4. Cálculo en tiempo real
    function calcularTotal() {
      const cant = parseFloat(document.getElementById('cantidad').value) || 0;
      const prec = parseFloat(document.getElementById('precio').value) || 0;
      const total = cant * prec;
      document.getElementById('total-pagar').textContent = `$${total.toFixed(2)}`;
    }

    // 5. Guardar en Google Sheets (Despensa GT)
    async function guardarRegistro() {
      const producto = document.getElementById('producto').value.trim();
      const precio = document.getElementById('precio').value;
      const cantidad = document.getElementById('cantidad').value;

      if (!producto || !precio) {
        alert("Por favor ingresa al menos el nombre del producto y el precio.");
        return;
      }

      const btnGuardar = document.getElementById('btn-guardar');
      btnGuardar.disabled = true;
      btnGuardar.textContent = "⏳ Guardando en Despensa GT...";

      const payload = {
        nombreProducto: producto,
        codigoBarras: document.getElementById('codigo').value,
        cantidad: parseFloat(cantidad),
        precioUnitario: parseFloat(precio),
        agregarACuenta: document.getElementById('seleccion').checked,
        gpsLocation: userGps,
        fotoBase64: fotoBase64
      };

      try {
        await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        alert("✅ Producto guardado correctamente en tu hoja Despensa GT");
        limpiarFormulario();

      } catch (error) {
        alert("❌ Error al guardar: " + error.message);
      } finally {
        btnGuardar.disabled = false;
        btnGuardar.textContent = "💾 Guardar en Despensa GT";
      }
    }

    function limpiarFormulario() {
      document.getElementById('codigo').value = '';
      document.getElementById('producto').value = '';
      document.getElementById('cantidad').value = '1';
      document.getElementById('precio').value = '';
      document.getElementById('foto-input').value = '';
      document.getElementById('preview-container').classList.add('hidden');
      document.getElementById('total-pagar').textContent = '$0.00';
      fotoBase64 = '';
    }
  </script>
</body>
</html>
