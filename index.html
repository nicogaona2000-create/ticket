<script>
  const URL_GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycbyAshF-k-zr2Ahas7EHn3q03CdJ4_clI3GgfB4X_XFcd3Zn1aW4szYolb9dlfSLJqKTxw/exec";

  let productos = [];
  let historico = [];
  let html5QrcodeScanner = null;
  let targetInputId = "";

  document.addEventListener("DOMContentLoaded", function() {
    cargarProductosDesdeSheets();
    cargarHistoricoDesdeSheets();
  });

  async function cargarProductosDesdeSheets() {
    const contenedor = document.getElementById('lista-productos');
    contenedor.innerHTML = '<p style="text-align:center; color:#777;">Cargando productos...</p>';

    try {
      const respuesta = await fetch(`${URL_GOOGLE_SCRIPT}?action=getProductos`);
      const resultado = await respuesta.json();

      if (resultado.result === "success") {
        productos = resultado.data;
        filtrarProductos();
      } else {
        contenedor.innerHTML = '<p style="text-align:center; color:red;">Error al cargar productos.</p>';
      }
    } catch (error) {
      console.error("Error consultando Sheets:", error);
      contenedor.innerHTML = '<p style="text-align:center; color:red;">No se pudieron cargar los datos.</p>';
    }
  }

  async function cargarHistoricoDesdeSheets() {
    const contenedor = document.getElementById('lista-historico');
    try {
      const respuesta = await fetch(`${URL_GOOGLE_SCRIPT}?action=getHistorico`);
      const resultado = await respuesta.json();

      if (resultado.result === "success") {
        historico = resultado.data;
        filtrarHistorico();
      }
    } catch (error) {
      console.error("Error consultando Histórico:", error);
    }
  }

  function cambiarVista(vista) {
    document.getElementById('vista-total').classList.add('hidden');
    document.getElementById('vista-comparador').classList.add('hidden');
    document.getElementById('vista-historico').classList.add('hidden');
    
    document.getElementById('tab-total').classList.remove('active');
    document.getElementById('tab-comparador').classList.remove('active');
    document.getElementById('tab-historico').classList.remove('active');

    if (vista === 'total') {
      document.getElementById('vista-total').classList.remove('hidden');
      document.getElementById('tab-total').classList.add('active');
      filtrarProductos();
    } else if (vista === 'comparador') {
      document.getElementById('vista-comparador').classList.remove('hidden');
      // CORRECCIÓN 1: Se agrega .add('active') correctamente
      document.getElementById('tab-comparador').classList.add('active'); 
    } else if (vista === 'historico') {
      document.getElementById('vista-historico').classList.remove('hidden');
      document.getElementById('tab-historico').classList.add('active');
      cargarHistoricoDesdeSheets();
    }
  }

  function toggleSeleccion(index) {
    productos[index].seleccion = !productos[index].seleccion;
    filtrarProductos();
  }

  function cambiarSeleccionTodos(estado) {
    productos.forEach(p => p.seleccion = estado);
    filtrarProductos();
  }

  function actualizarTotal() {
    const total = productos.reduce((suma, p) => {
      return p.seleccion ? suma + (parseFloat(p.cantidad || 1) * parseFloat(p.precio || 0)) : suma;
    }, 0);

    document.getElementById('total-monto').innerText = `$${total.toFixed(2)}`;
  }

  function renderizarLista(lista = productos) {
    const contenedor = document.getElementById('lista-productos');
    contenedor.innerHTML = '';

    if (!lista || lista.length === 0) {
      contenedor.innerHTML = '<p style="text-align:center; color:#777;">No se encontraron productos.</p>';
      actualizarTotal();
      return;
    }

    const listaOrdenada = [...lista].sort((a, b) => {
      if (a.seleccion === b.seleccion) return 0;
      return a.seleccion ? -1 : 1;
    });

    listaOrdenada.forEach((p) => {
      const indexReal = productos.findIndex(prod => String(prod.id) === String(p.id));
      const esSeleccionado = p.seleccion === true;
      
      const mapUrl = p.gps && String(p.gps).includes(',') ? `https://maps.google.com/?q=${encodeURIComponent(p.gps)}` : null;

      contenedor.innerHTML += `
        <div class="card card-clickable flex" style="${esSeleccionado ? 'border-left: 5px solid #1a73e8; background-color: #f8fafd;' : ''}">
          <div style="flex-grow: 1;" onclick="abrirModal('${p.id}')">
            <strong>${p.producto || p.nombre}</strong><br>
            <small>Código: ${p.codigo}</small><br>
            <small>Cant: ${p.cantidad} | Precio: $${parseFloat(p.precio || 0).toFixed(2)}</small><br>
            <small style="color: #666;">Ubicación: ${p.gps || 'Sin GPS'} 
              ${mapUrl ? `<a href="${mapUrl}" target="_blank" onclick="event.stopPropagation();" style="color:#1a73e8; font-weight:bold; text-decoration:none;">[📍 Ver Mapa]</a>` : ''}
            </small>
          </div>
          <div onclick="event.stopPropagation();">
            <label style="cursor: pointer; font-weight: bold; color: ${esSeleccionado ? '#1a73e8' : '#666'};">
              <input type="checkbox" ${esSeleccionado ? 'checked' : ''} onchange="toggleSeleccion(${indexReal})"> Comprar
            </label>
          </div>
        </div>
      `;
    });

    actualizarTotal();
  }

  function renderizarHistorico(lista = historico) {
    const contenedor = document.getElementById('lista-historico');
    contenedor.innerHTML = '';

    if (!lista || lista.length === 0) {
      contenedor.innerHTML = '<p style="text-align:center; color:#777;">No se encontraron registros en el histórico.</p>';
      return;
    }

    const ordenado = [...lista].reverse();

    ordenado.forEach(h => {
      const totalCompra = (parseFloat(h.cantidad || 1) * parseFloat(h.precio || 0)).toFixed(2);
      const mapUrl = h.gps && String(h.gps).includes(',') ? `https://maps.google.com/?q=${encodeURIComponent(h.gps)}` : null;

      contenedor.innerHTML += `
        <div class="card">
          <div class="flex">
            <strong>${h.producto || h.nombre || 'Producto'}</strong>
            <span class="badge-compra">Comprado</span>
          </div>
          <div style="font-size: 13px; color: #555; margin-top: 5px;">
            <strong>Código:</strong> ${h.codigo}<br>
            <strong>Fecha:</strong> ${h.fecha || 'N/D'}<br>
            <strong>Cantidad:</strong> ${h.cantidad} | <strong>Precio Unitario:</strong> $${parseFloat(h.precio || 0).toFixed(2)}<br>
            <strong>Total pagado:</strong> <span style="color:#1a73e8; font-weight:bold;">$${totalCompra}</span><br>
            <strong>Ubicación:</strong> ${h.gps || 'Sin GPS'} 
            ${mapUrl ? `<a href="${mapUrl}" target="_blank" style="color:#1a73e8; font-weight:bold; text-decoration:none;">[ Ver Mapa 📍]</a>` : ''}
          </div>
        </div>
      `;
    });
  }

  function filtrarProductos() {
    const texto = (document.getElementById('buscar').value || '').trim().toLowerCase();
    if (!texto) {
      renderizarLista(productos);
      return;
    }
    const filtrados = productos.filter(p => {
      const nombre = (p.producto || p.nombre || '').toString().toLowerCase();
      const codigo = (p.codigo || '').toString().toLowerCase();
      return nombre.includes(texto) || codigo.includes(texto);
    });
    renderizarLista(filtrados);
  }

  function filtrarHistorico() {
    const texto = (document.getElementById('buscar-historico').value || '').trim().toLowerCase();
    if (!texto) {
      renderizarHistorico(historico);
      return;
    }
    const filtrados = historico.filter(h => {
      const nombre = (h.producto || h.nombre || '').toString().toLowerCase();
      const codigo = (h.codigo || '').toString().toLowerCase();
      return nombre.includes(texto) || codigo.includes(texto);
    });
    renderizarHistorico(filtrados);
  }

  function obtenerUbicacionGPS() {
    const inputGps = document.getElementById('p-gps');
    inputGps.value = "Obteniendo ubicación...";

    return new Promise((resolve) => {
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const coords = `${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}`;
            inputGps.value = coords;
            resolve(coords);
          },
          (err) => {
            console.warn("GPS error o permiso denegado:", err);
            inputGps.value = "Ubicación no disponible";
            resolve("Ubicación no disponible");
          },
          { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
        );
      } else {
        inputGps.value = "GPS no soportado";
        resolve("GPS no soportado");
      }
    });
  }

  async function procesarPago() {
    const seleccionados = productos.filter(p => p.seleccion === true);

    if (seleccionados.length === 0) {
      alert("Por favor, selecciona al menos un producto para pagar.");
      return;
    }

    const btnPagar = document.getElementById('btn-pagar');
    btnPagar.disabled = true;
    btnPagar.innerText = "Procesando...";

    let ubicacionGps = await obtenerUbicacionGPS();

    try {
      await fetch(URL_GOOGLE_SCRIPT, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "registrarCompra",
          productos: seleccionados,
          gps: ubicacionGps
        })
      });

      alert(`¡Compra registrada! Se guardaron ${seleccionados.length} productos en HISTORICO.`);

      productos.forEach(p => p.seleccion = false);
      filtrarProductos();
    } catch (error) {
      console.error("Error al registrar el pago:", error);
      alert("Ocurrió un error al intentar procesar el pago.");
    } finally {
      btnPagar.disabled = false;
      btnPagar.innerText = "💳 PAGAR";
    }
  }

  function abrirEscaner(inputId) {
    targetInputId = inputId;
    document.getElementById('scanner-overlay').classList.remove('hidden');

    Html5Qrcode.getCameras().then(devices => {
      if (devices && devices.length) {
        const select = document.getElementById('camera-select');
        select.innerHTML = '';
        devices.forEach((cam, idx) => {
          const opt = document.createElement('option');
          opt.value = cam.id;
          opt.text = cam.label || `Cámara ${idx + 1}`;
          select.appendChild(opt);
        });
        const camaraInicial = devices[devices.length - 1].id;
        select.value = camaraInicial;
        iniciarCamara(camaraInicial);
      }
    }).catch(() => iniciarCamara({ facingMode: "environment" }));
  }

  function iniciarCamara(cameraIdOrConfig) {
    if (html5QrcodeScanner) {
      html5QrcodeScanner.stop().then(() => iniciarInstancia(cameraIdOrConfig)).catch(() => iniciarInstancia(cameraIdOrConfig));
    } else {
      iniciarInstancia(cameraIdOrConfig);
    }
  }

  function iniciarInstancia(cameraIdOrConfig) {
    html5QrcodeScanner = new Html5Qrcode("reader");
    html5QrcodeScanner.start(
      cameraIdOrConfig,
      { fps: 15, qrbox: { width: 280, height: 160 } },
      (decodedText) => {
        document.getElementById(targetInputId).value = decodedText;
        cerrarEscaner();
        if (targetInputId === 'buscar') filtrarProductos();
        if (targetInputId === 'buscar-historico') filtrarHistorico();
      }
    ).catch(err => console.warn(err));
  }

  function cambiarCamara() {
    const selectedId = document.getElementById('camera-select').value;
    if (selectedId) iniciarCamara(selectedId);
  }

  function cerrarEscaner() {
    if (html5QrcodeScanner) {
      html5QrcodeScanner.stop().then(() => {
        html5QrcodeScanner.clear();
        document.getElementById('scanner-overlay').classList.add('hidden');
      }).catch(() => document.getElementById('scanner-overlay').classList.add('hidden'));
    } else {
      document.getElementById('scanner-overlay').classList.add('hidden');
    }
  }

  async function abrirModal(idProducto = null) {
    document.getElementById('modal-producto').classList.remove('hidden');

    if (idProducto) {
      // CORRECCIÓN 2: Comparación segura convertida a String
      const p = productos.find(prod => String(prod.id) === String(idProducto));
      if (p) {
        document.getElementById('modal-titulo').innerText = "Editar Producto";
        document.getElementById('p-id').value = p.id;
        document.getElementById('p-nombre').value = p.producto || p.nombre;
        document.getElementById('p-codigo').value = p.codigo;
        document.getElementById('p-cantidad').value = p.cantidad;
        document.getElementById('p-precio').value = p.precio;
        document.getElementById('p-seleccion').checked = p.seleccion;
        document.getElementById('p-fecha').value = p.fecha || "";
        document.getElementById('p-gps').value = p.gps || "";
      }
    } else {
      document.getElementById('modal-titulo').innerText = "Registro de Producto";
      document.getElementById('form-nuevo-producto').reset();
      document.getElementById('p-id').value = "";
      
      const ahora = new Date();
      ahora.setMinutes(ahora.getMinutes() - ahora.getTimezoneOffset());
      document.getElementById('p-fecha').value = ahora.toISOString().slice(0, 16);

      document.getElementById('p-gps').value = "Obteniendo ubicación...";
      
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const coords = `${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}`;
            document.getElementById('p-gps').value = coords;
          },
          (err) => {
            console.warn("Error obteniendo GPS al abrir modal:", err);
            document.getElementById('p-gps').value = "Ubicación no disponible";
          },
          { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
        );
      } else {
        document.getElementById('p-gps').value = "GPS no soportado";
      }
    }
  }

  function cerrarModal() {
    document.getElementById('modal-producto').classList.add('hidden');
    document.getElementById('form-nuevo-producto').reset();
  }

  async function guardarProducto(event) {
    event.preventDefault();

    const btnSubmit = document.getElementById('btn-submit');
    btnSubmit.innerText = "Guardando...";
    btnSubmit.disabled = true;

    let coordsGps = document.getElementById('p-gps').value;
    if (!coordsGps || coordsGps === "Obteniendo ubicación...") {
      coordsGps = await obtenerUbicacionGPS();
    }

    const idExistente = document.getElementById('p-id').value;

    const productoObj = {
      action: "guardarProducto",
      id: idExistente ? parseInt(idExistente) : Date.now(),
      producto: document.getElementById('p-nombre').value,
      codigo: document.getElementById('p-codigo').value,
      cantidad: parseFloat(document.getElementById('p-cantidad').value) || 1,
      precio: parseFloat(document.getElementById('p-precio').value) || 0,
      seleccion: document.getElementById('p-seleccion').checked,
      fecha: document.getElementById('p-fecha').value,
      gps: coordsGps
    };

    try {
      await fetch(URL_GOOGLE_SCRIPT, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(productoObj)
      });

      if (idExistente) {
        const index = productos.findIndex(p => String(p.id) === String(idExistente));
        if (index !== -1) productos[index] = productoObj;
      } else {
        productos.push(productoObj);
      }

      filtrarProductos();
      cerrarModal();
    } catch (err) {
      console.error("Error al guardar en Sheets:", err);
      alert("Ocurrió un error al intentar enviar la información a Google Sheets.");
    } finally {
      btnSubmit.innerText = "Guardar";
      btnSubmit.disabled = false;
    }
  }

  function calcularPrecio2() {
    const g1 = parseFloat(document.getElementById('g1').value) || 0;
    const p1 = parseFloat(document.getElementById('p1').value) || 0;
    const g2 = parseFloat(document.getElementById('g2').value) || 0;
    const inputP2 = document.getElementById('p2');
    const divResultado = document.getElementById('resultado-comparador');

    if (g1 > 0 && p1 > 0 && g2 > 0) {
      const precioCalculado = (p1 * g2) / g1;
      inputP2.value = precioCalculado.toFixed(2);
      divResultado.innerHTML = `Para que ${g2}g/ml sea equivalente, debe costar <strong>$${precioCalculado.toFixed(2)}</strong> o menos.`;
    } else {
      inputP2.value = '';
      divResultado.innerText = 'Ingresa Gramos 1, Precio 1 y Gramos 2 para calcular.';
    }
  }
</script>
